<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, Arial, sans-serif; max-width: 480px; margin: 40px auto; color: #202124; }
  h1 { font-size: 18px; }
  p { color: #5f6368; font-size: 13px; line-height: 1.5; }
  .row { display: flex; gap: 8px; margin: 16px 0; }
  input[type="text"] { flex: 1; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 13px; }
  li button { background: none; color: #d93025; padding: 2px 6px; }
</style>
</head>
<body>
  <h1>🎧 YT Audio Saver — Settings</h1>
  <p>Channels on this list always play at full quality, even when "force lowest quality" is on.</p>
  <div class="row">
    <input type="text" id="channelInput" placeholder="Channel name, exactly as shown on YouTube" />
    <button id="addChannel">Add</button>
  </div>
  <ul id="whitelistUl"></ul>
  <script src="options.js"></script>
</body>
</html>
